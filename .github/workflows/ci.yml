name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Hard gate: types must be sound. This is the regression net that was missing.
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      # Hard gate: errors fail the build (warnings stay visible).
      - name: Lint
        run: npx eslint .

  # FOLLOW-UP: an e2e job that spins up postgres+minio (services:), runs the
  # seeds, boots `next start`, and executes scripts/e2e-*.mjs against it. Left
  # out of the MVP because it needs seeded data + a running server + secrets.
